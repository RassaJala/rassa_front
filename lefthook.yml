# Git hooks orchestration via lefthook.
# pre-commit: format + lint on staged files. commitlint: validates commit message.

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --config config/commitlint.config.ts --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: bunx prettier --config config/prettier.config.mjs --write {staged_files}
      glob: '*.{ts,tsx,js,jsx,mjs,json,md,yml,yaml}'
      stage_fixed: true

    - name: eslint
      run: bunx eslint -c config/eslint.config.ts --fix {staged_files}
      glob: '*.{ts,tsx}'
      stage_fixed: true
