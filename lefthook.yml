# Configuración de Git hooks via lefthook.
# pre-commit: verifica formato, lint y tipos. NO modifica archivos.
# Si alguna verificación falla, el commit se rechaza y el working tree queda intacto.
# El desarrollador corre `bun run format && bun run lint:fix` manualmente antes del commit.

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --config config/commitlint.config.ts --edit {1}

pre-commit:
  # No stashear unstaged changes — evita pérdida de cambios si el hook falla o se interrumpe
  stash_unstaged_changes: false
  parallel: true
  jobs:
    - name: prettier
      # --check: solo verifica, no escribe. Si falla, el developer debe correr bun run format
      run: bunx prettier --config config/prettier.config.mjs --check {staged_files}
      glob: '*.{ts,tsx,js,jsx,mjs,json,md,yml,yaml}'

    - name: eslint
      # Sin --fix: solo verifica. Si falla, el developer debe correr bun run lint:fix
      run: bunx eslint -c config/eslint.config.ts {staged_files}
      glob: '*.{ts,tsx}'

    - name: typecheck
      # Verifica que todos los tipos sean correctos
      run: bunx tsc --noEmit
